name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    name: Test
    uses: ./.github/workflows/check.yml

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: read
    steps:

      -
        name: Set version
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          minor="${{ vars.MINOR }}"
          minor="${minor#0}"
          version="1.${{ vars.MAJOR }}.${minor:-0}"

          if [ -z "${{ vars.MAJOR }}" ] || [ -z "${{ vars.MINOR }}" ]; then
            echo "ERROR: MAJOR and MINOR repository variables must be set." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_ENV"
          echo "Building version: $version"

      -
        name: Check if the tag exists locally
        uses: action-pack/tag-exists@v1
        id: checkTag
        with:
          tag: '${{ env.version }}'

      -
        name: Finish when found
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          echo "exists=${{ steps.checkTag.outputs.exists }}" >> "$GITHUB_ENV"

      -
        name: Checkout
        if: env.exists == 'false'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      -
        name: Docker metadata
        if: env.exists == 'false'
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,priority=100
            type=raw,value=${{ env.version }}
          labels: |
            org.opencontainers.image.title=${{ vars.NAME }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      -
        name: Set up Docker Buildx
        if: env.exists == 'false'
        uses: docker/setup-buildx-action@v4

      -
        name: Build binaries
        if: env.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false
          outputs: type=local,dest=output
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION_ARG=${{ steps.meta.outputs.version }}

      -
        name: Rename binaries
        if: env.exists == 'false'
        run: |
          mv output/linux_amd64/boot-logo.bin output/boot-logo_amd64.bin
          mv output/linux_arm64/boot-logo.bin output/boot-logo_arm64.bin

      -
        name: Create a release
        if: env.exists == 'false'
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ steps.meta.outputs.version }}"
          title: "v${{ steps.meta.outputs.version }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Update release
        if: env.exists == 'false'
        uses: AButler/upload-release-assets@v4.0.0
        with:
          files: "output/*"
          release-tag: "v${{ steps.meta.outputs.version }}"
          repo-token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Increment version variable
        if: env.exists == 'false'
        uses: action-pack/increment@v2
        with:
          name: 'MAJOR'
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Send mail
        if: env.exists == 'false'
        uses: action-pack/send-mail@v1
        with:
          to: ${{ secrets.MAILTO }}
          from: Github Actions <${{ secrets.MAILTO }}>
          connection_url: ${{ secrets.MAIL_CONNECTION }}
          subject: Build of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} completed
          body: |
            The build job of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} was completed successfully!

            See https://github.com/${{ github.repository }}/actions for more information.
