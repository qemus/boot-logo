name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    name: Test
    uses: ./.github/workflows/check.yml

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,priority=100
            type=raw,value=${{ vars.MAJOR }}.${{ vars.MINOR }}
          labels: |
            org.opencontainers.image.title=${{ vars.NAME }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=output
          build-args: |
            VERSION_ARG=${{ steps.meta.outputs.version }}
      -
        name: Rename binaries
        run: |
          mv output/linux_amd64/boot-logo.bin output/boot-logo-amd64.bin
          mv output/linux_arm64/boot-logo.bin output/boot-logo-arm64.bin
      -
        name: Create a release
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ steps.meta.outputs.version }}"
          title: "v${{ steps.meta.outputs.version }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Update release
        uses: AButler/upload-release-assets@v4.0.0
        with:
          files: "output/boot-logo-*.bin"
          release-tag: "v${{ steps.meta.outputs.version }}"
          repo-token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Increment version variable
        uses: action-pack/bump@v2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Send mail
        uses: action-pack/send-mail@v1
        with:
          to: ${{ secrets.MAILTO }}
          from: Github Actions <${{ secrets.MAILTO }}>
          connection_url: ${{ secrets.MAIL_CONNECTION }}
          subject: Build of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} completed
          body: |
            The build job of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} was completed successfully!

            See https://github.com/${{ github.repository }}/actions for more information.
