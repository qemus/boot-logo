name: Update Fiano

on:
  repository_dispatch:
    types:
      - fiano-module-updated
  workflow_dispatch:

concurrency:
  group: update-fiano
  cancel-in-progress: false

jobs:
  update:
    name: Update Fiano module
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      -
        name: Update Fiano
        working-directory: src
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          go mod edit \
            -replace=github.com/linuxboot/fiano=github.com/qemus/fiano@module

          go mod tidy
          go test ./...

      -
        name: Commit update
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          if git diff --quiet -- src/go.mod src/go.sum; then
            echo "Fiano is already up to date."
            exit 0
          fi

          version=$(
            sed -n \
              's|^replace github.com/linuxboot/fiano => github.com/qemus/fiano \(v[^[:space:]]*\)$|\1|p' \
              src/go.mod
          )

          if [ -z "$version" ]; then
            echo "ERROR: Failed to read the resolved Fiano version." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/go.mod src/go.sum
          git commit -m "build: update Fiano to ${version}"
          git push
